AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Multi-Environment AppConfig SAM Deployment

  '
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - staging
    - prod
    Description: The deployment environment name
Resources:
  MyAppApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
  MyAppConfig:
    Type: AWS::AppConfig::Application
    Properties:
      Name:
        Fn::Sub: FeatureFlagApp-${Environment}
  MyAppConfigEnv:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId:
        Ref: MyAppConfig
      Name:
        Ref: Environment
  MyAppConfigProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId:
        Ref: MyAppConfig
      Name: FeatureToggles
      LocationUri: hosted
  MyAppConfigVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId:
        Ref: MyAppConfig
      ConfigurationProfileId:
        Ref: MyAppConfigProfile
      Content: '{"new_payment_ui": true}'
      ContentType: application/json
  MyAppConfigDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId:
        Ref: MyAppConfig
      EnvironmentId:
        Ref: MyAppConfigEnv
      ConfigurationProfileId:
        Ref: MyAppConfigProfile
      ConfigurationVersion:
        Ref: MyAppConfigVersion
      DeploymentStrategyId: AppConfig.AllAtOnce
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: MyFunction
      Handler: app.lambda_handler
      Runtime: python3.11
      Architectures:
      - arm64
      Environment:
        Variables:
          APP_ENV:
            Ref: Environment
          APPCONFIG_APP_ID:
            Ref: MyAppConfig
          APPCONFIG_ENV_ID:
            Ref: MyAppConfigEnv
          APPCONFIG_PROFILE_ID: broken-profile-id
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - appconfig:StartConfigurationSession
          - appconfig:GetLatestConfiguration
          Resource: '*'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: MyAppApi
            Path: /status
            Method: get
    Metadata:
      SamResourceId: MyFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${MyAppApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/status
