AWSTemplateFormatVersion: '2010-09-09'
Description: 'Layer 3: CloudWatch Dashboard, Alarms, and SNS Subscription'

Parameters:
  AlertEmail:
    Type: String
    Description: 'Email address to receive SNS alerts'
    Default: 'lokeshsaver88@gmail.com'

Resources:
  # 1. The SNS Email Subscription (Binding to Layer 1)
  EmailSubscription:
    Type: 'AWS::SNS::Subscription'
    Properties:
      TopicArn: !ImportValue AlertTopicArn # Assuming exported from Layer 1
      Protocol: email
      Endpoint: !Ref AlertEmail

  # 2. The CloudWatch Alarm for Errors (Sourced from Layer 2 EMF)
  ErrorRateAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: 'App-High-Error-Rate'
      AlarmDescription: 'Triggers when Lambda EMF reports > 5 errors in 1 minute'
      Namespace: 'ServerlessApp' # Matches the "Namespace" in our Python EMF code
      MetricName: 'AppErrors'    # Matches the "Name" in our Python EMF code
      Dimensions:
        - Name: 'FunctionName'
          Value: 'AppMetricsGenerator'
      Statistic: 'Sum'
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: 'GreaterThanThreshold'
      TreatMissingData: 'notBreaching'
      AlarmActions:
        - !ImportValue AlertTopicArn # Triggers the SNS Topic!

  # 3. The CloudWatch Dashboard with Metrics and Logs Insights
  ObservabilityDashboard:
    Type: 'AWS::CloudWatch::Dashboard'
    Properties:
      DashboardName: 'Lambda-Observability-Dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "metrics": [ [ "ServerlessApp", "AppErrors", "FunctionName", "AppMetricsGenerator", { "stat": "Sum", "color": "#d13212" } ] ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Error Count (EMF)"
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "metrics": [ [ "ServerlessApp", "AppLatency", "FunctionName", "AppMetricsGenerator", { "stat": "Average", "color": "#1f77b4" } ] ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Latency (EMF)"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/AppMetricsGenerator' | fields @timestamp, AppLatency, AppErrors, RequestId | filter AppErrors = 1 | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}",
                "title": "Logs Insights: Failed Transactions Tracker"
              }
            }
          ]
        }