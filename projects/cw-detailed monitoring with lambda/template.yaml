AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Production-grade CRUD backend using AWS SAM, API Gateway REST API,
  Lambda (Node.js 20.x), and DynamoDB (PAY_PER_REQUEST).
  IAM roles follow the principle of least privilege.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: API Gateway deployment stage name.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch Log Group retention period in days.

# ─────────────────────────────────────────────────────────────────────────────
# Globals — applied to every AWS::Serverless::Function unless overridden
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 29                        # 1 s under API GW max to surface timeouts cleanly
    Architectures: [arm64]             # Graviton2 — cheaper + faster for I/O-bound workloads
    Environment:
      Variables:
        TABLE_NAME: !Ref ItemsTable
        POWERTOOLS_SERVICE_NAME: crud-backend
        LOG_LEVEL: INFO
    Tracing: Active                    # AWS X-Ray active tracing
  Api:
    TracingEnabled: true
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        MetricsEnabled: true
        DataTraceEnabled: false        # Disable to avoid logging sensitive request/response bodies in prod
        LoggingLevel: ERROR

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ───────────────────────────────────────────────
  # 1. DynamoDB Table
  # ───────────────────────────────────────────────
  ItemsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain             # Prevent accidental data loss on stack delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-items"
      BillingMode: PAY_PER_REQUEST     # On-Demand — no capacity planning required
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true               # AES-256 encryption at rest (AWS-managed key)
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: CrudBackend
        - Key: Environment
          Value: !Ref StageName

  # ───────────────────────────────────────────────
  # 2. Dedicated IAM Execution Role (Least Privilege)
  # ───────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBCrudPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDBTableAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt ItemsTable.Arn
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*"
        - PolicyName: XRayTracingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: XRayDaemonWriteAccess
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  # ───────────────────────────────────────────────
  # 3. API Gateway REST API with Request Validation
  # ───────────────────────────────────────────────
  CrudApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      EndpointConfiguration:
        Type: REGIONAL
      # Request validators — two validators referenced by name in method definitions
      Models:
        CreateItemModel:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            description:
              type: string
              maxLength: 1024
        UpdateItemModel:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 256
            description:
              type: string
              maxLength: 1024
      # Explicit gateway responses for common error codes
      GatewayResponses:
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error": "Client error", "message": "$context.error.messageString", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error": "Internal server error", "message": "$context.error.messageString", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        BAD_REQUEST_BODY:
          StatusCode: 400
          ResponseTemplates:
            application/json: '{"error": "Bad Request", "message": "$context.error.validationErrorString", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        MISSING_AUTHENTICATION_TOKEN:
          StatusCode: 404
          ResponseTemplates:
            application/json: '{"error": "Not Found", "message": "The requested route does not exist", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        REQUEST_TOO_LARGE:
          StatusCode: 413
          ResponseTemplates:
            application/json: '{"error": "Payload Too Large", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        THROTTLED:
          StatusCode: 429
          ResponseTemplates:
            application/json: '{"error": "Too Many Requests", "message": "Rate limit exceeded", "requestId": "$context.requestId"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  # ───────────────────────────────────────────────
  # 4. Lambda Function
  # ───────────────────────────────────────────────
  CrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-crud-handler"
      Handler: app.handler
      CodeUri: src/
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Handles all CRUD operations for the Items resource.
      ReservedConcurrentExecutions: 50   # Guard against runaway invocations
      Events:
        # ── Create ──────────────────────────────
        CreateItem:
          Type: Api
          Properties:
            RestApiId: !Ref CrudApi
            Path: /items
            Method: POST
            RequestModel:
              Model: CreateItemModel
              Required: true
              ValidateBody: true
        # ── Read (single) ────────────────────────
        GetItem:
          Type: Api
          Properties:
            RestApiId: !Ref CrudApi
            Path: /items/{itemId}
            Method: GET
            RequestParameters:
              - method.request.path.itemId:
                  Required: true
        # ── List (all) ───────────────────────────
        ListItems:
          Type: Api
          Properties:
            RestApiId: !Ref CrudApi
            Path: /items
            Method: GET
        # ── Update ──────────────────────────────
        UpdateItem:
          Type: Api
          Properties:
            RestApiId: !Ref CrudApi
            Path: /items/{itemId}
            Method: PUT
            RequestParameters:
              - method.request.path.itemId:
                  Required: true
            RequestModel:
              Model: UpdateItemModel
              Required: true
              ValidateBody: true
        # ── Delete ──────────────────────────────
        DeleteItem:
          Type: Api
          Properties:
            RestApiId: !Ref CrudApi
            Path: /items/{itemId}
            Method: DELETE
            RequestParameters:
              - method.request.path.itemId:
                  Required: true

  # ───────────────────────────────────────────────
  # 5. CloudWatch Log Group (explicit, with retention)
  # ───────────────────────────────────────────────
  CrudFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: CrudFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CrudFunction}"
      RetentionInDays: !Ref LogRetentionDays

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: Base URL for all CRUD endpoints.
    Value: !Sub "https://${CrudApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiBaseUrl"

  ItemsEndpoint:
    Description: Items resource endpoint.
    Value: !Sub "https://${CrudApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/items"

  DynamoDBTableName:
    Description: DynamoDB table name.
    Value: !Ref ItemsTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  DynamoDBTableArn:
    Description: DynamoDB table ARN.
    Value: !GetAtt ItemsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

  LambdaFunctionArn:
    Description: CRUD Lambda function ARN.
    Value: !GetAtt CrudFunction.Arn

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN.
    Value: !GetAtt LambdaExecutionRole.Arn
