AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys a full serverless database stack (Secret, RDS Instance, RDS Proxy, and Lambda) inside an existing VPC.'

Parameters:
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: 'The ID of your existing VPC.'
  
  PrivateSubnetIds:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: 'The private subnets where Lambda, the RDS Proxy, and the DB Instance will reside.'

Resources:

  # =========================================================================
  # 1. SECRETS MANAGER (Auto-generates Secure DB Credentials)
  # =========================================================================
  DBSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Name: 'app-db-credentials-secret'
      Description: 'Maintains master credentials for the RDS instance'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgresadmin"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\'

  # =========================================================================
  # 2. NETWORKING & SECURITY GROUPS
  # =========================================================================
  DBSubnetGroup:
    Type: 'AWS::RDS::DBSubnetGroup'
    Properties:
      DBSubnetGroupDescription: 'Subnet group for the RDS database instance'
      SubnetIds: !Ref PrivateSubnetIds

  # Lambda Security Group (Outbound traffic allowed)
  LambdaSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security group for VPC-enabled Lambda function'
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  # RDS Proxy Security Group (ONLY allows traffic from Lambda SG)
  RDSProxySecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security group for RDS Proxy'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # Database Security Group (ONLY allows traffic from RDS Proxy SG)
  DBSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Security group for the backend RDS DB Instance'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RDSProxySecurityGroup

  # =========================================================================
  # 3. RDS DATABASE INSTANCE
  # =========================================================================
  RDSInstance:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      AllocatedStorage: '20'
      DBInstanceClass: 'db.t4g.micro' # Cost-effective, burstable Graviton instance
      DBInstanceIdentifier: 'app-postgres-database'
      Engine: 'postgres'
      EngineVersion: '15'
      MasterUsername: 'postgresadmin'
      # Securely fetches the auto-generated password from Secrets Manager at launch
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      DeletionProtection: false
      SkipFinalSnapshot: true

  # =========================================================================
  # 4. IAM ROLES
  # =========================================================================
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  RDSProxyRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: RDSProxySecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: !Ref DBSecret

  # =========================================================================
  # 5. RDS PROXY & TARGET GROUP
  # =========================================================================
  RDSProxy:
    Type: 'AWS::RDS::DBProxy'
    Properties:
      DBProxyName: 'app-rds-proxy'
      EngineFamily: 'POSTGRESQL'
      RoleArn: !GetAtt RDSProxyRole.Arn
      VpcSubnetIds: !Ref PrivateSubnetIds
      VpcSecurityGroupIds:
        - !Ref RDSProxySecurityGroup
      Auth:
        - AuthScheme: 'SECRETS'
          SecretArn: !Ref DBSecret
          IAMAuth: 'DISABLED'

  RDSProxyTargetGroup:
    Type: 'AWS::RDS::DBProxyTargetGroup'
    Properties:
      DBProxyName: !Ref RDSProxy
      TargetGroupName: 'default'
      DBInstanceIdentifiers:
        - !Ref RDSInstance

  # =========================================================================
  # 6. LAMBDA FUNCTION
  # =========================================================================
  LambdaFunction:
    Type: 'AWS::Lambda::Function'
    DependsOn: RDSProxyTargetGroup
    Properties:
      FunctionName: 'vpc-rds-proxy-processor'
      Handler: 'index.handler'
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: 'nodejs20.x'
      MemorySize: 1024
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt RDSProxy.Endpoint
      Code:
        ZipFile: |
          exports.handler = async (event) => {
              console.log("Connected via Proxy Endpoint:", process.env.DB_HOST);
              return {
                  statusCode: 200,
                  body: JSON.stringify({ message: "Connected successfully to proxy-wrapped RDS infrastructure." })
              };
          };

Outputs:
  ProxyEndpoint:
    Description: 'The endpoint for the RDS Proxy connection pool'
    Value: !GetAtt RDSProxy.Endpoint
  SecretArn:
    Description: 'The ARN of the managed database credentials'
    Value: !Ref DBSecret