<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Architecture Load Tester</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 30px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #38bdf8; }
        input[type="text"], input[type="file"] { width: 95%; padding: 12px; margin-top: 10px; margin-bottom: 20px; background: #020617; color: #fff; border: 1px solid #334155; border-radius: 5px; font-size: 14px; }
        button { background: #10b981; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; transition: 0.2s; width: 100%; }
        button:hover { background: #059669; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #log-console { margin-top: 20px; background: #000; padding: 15px; border-radius: 5px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #334155; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Multi-Image API Tester</h2>
        <p style="color: #94a3b8; font-size: 14px;">Select multiple small images (under 5MB each) to test your S3 and DynamoDB write performance.</p>

        <label><strong>1. Paste your API Gateway URL:</strong></label>
        <input type="text" id="apiUrl" placeholder="">

        <label><strong>2. Select Images (You can select multiple):</strong></label>
        <input type="file" id="fileInput" accept="image/jpeg, image/png" multiple>

        <button id="sendBtn" onclick="processAndSend()">Send All to AWS</button>

        <div id="log-console">
            <div class="info">Waiting for action...</div>
        </div>
    </div>

    <script>
        function logMessage(msg, type = 'info') {
            const consoleDiv = document.getElementById('log-console');
            const entry = document.createElement('div');
            entry.className = type;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight; // Auto-scroll
        }

        async function processAndSend() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const files = document.getElementById('fileInput').files;
            const sendBtn = document.getElementById('sendBtn');

            if (!apiUrl) return alert("Please paste your API Gateway URL!");
            if (files.length === 0) return alert("Please select at least one image.");

            sendBtn.disabled = true;
            logMessage(`Starting upload sequence for ${files.length} images...`, 'info');

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Keep files relatively small to avoid API Gateway 10MB limits
                if (file.size > 6 * 1024 * 1024) {
                    logMessage(`Skipping ${file.name} - file too large (over 6MB).`, 'error');
                    continue;
                }

                logMessage(`Processing ${file.name}...`, 'info');

                try {
                    const base64Data = await convertToBase64(file);
                    await sendToApi(apiUrl, file.name, base64Data);
                } catch (error) {
                    logMessage(`Failed to send ${file.name}: ${error.message}`, 'error');
                }
            }

            logMessage("🏁 Upload sequence complete.", 'info');
            sendBtn.disabled = false;
        }

        // Helper to convert file to Base64 using a Promise
        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // reader.result looks like: "data:image/jpeg;base64,/9j/4AAQSkZJ..."
                    // We must strip the metadata prefix because your Lambda expects pure Base64
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // Helper to POST to your API Gateway
        async function sendToApi(url, filename, base64Data) {
            const productId = `demo-${Math.floor(Math.random() * 100000)}`;
            
            const payload = {
                product_id: productId,
                image_base64: base64Data
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - ${response.statusText}`);
            }

            const data = await response.json();
            logMessage(`✅ Success! [${filename}] saved. ID: ${productId}`, 'success');
        }
    </script>
</body>
</html>
