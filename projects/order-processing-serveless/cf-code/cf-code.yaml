AWSTemplateFormatVersion: '2010-09-09'
Description: 'Golden Jacket Practice: Single-Table Multi-Queue Serverless Order Processing Pipeline'

Resources:
  # ==========================================
  # 1. CONSOLIDATED DATABASE LAYER (Single-Table)
  # ==========================================
  UnifiedOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: UnifiedOrdersTable
      AttributeDefinitions: 
        - AttributeName: OrderId
          AttributeType: S
      KeySchema: 
        - AttributeName: OrderId
          KeyType: HASH
      # SPOT ON: On-Demand handles combined spiky workloads from multiple upstream queues
      BillingMode: PAY_PER_REQUEST 

  # ==========================================
  # 2. MESSAGING LAYER (SNS Topic & Distinct Queues)
  # ==========================================
  OrderFanoutTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: OrderFanoutTopic

  # --- Car Orders Pipeline Resources ---
  CarOrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CarOrders-DLQ

  CarOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CarOrdersQueue
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CarOrdersDLQ.Arn
        maxReceiveCount: 3

  # --- Bike Orders Pipeline Resources ---
  BikeOrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: BikeOrders-DLQ

  BikeOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: BikeOrdersQueue
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BikeOrdersDLQ.Arn
        maxReceiveCount: 3

  # ==========================================
  # 3. SUBSCRIPTIONS & INTER-SERVICE POLICIES
  # ==========================================
  CarOrdersSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt CarOrdersQueue.Arn
      Protocol: sqs
      TopicArn: !Ref OrderFanoutTopic

  BikeOrdersSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt BikeOrdersQueue.Arn
      Protocol: sqs
      TopicArn: !Ref OrderFanoutTopic

  AllowSNSTowriteToQueuesPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: 
        - !Ref CarOrdersQueue
        - !Ref BikeOrdersQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: "*"
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderFanoutTopic

  # ==========================================
  # 4. COMPUTE & EXECUTION LAYER
  # ==========================================
  
  # Shared Worker IAM Role (Both workers use this to write to the SAME table)
  WorkerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: SingleTableWriteAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:PutItem
                Resource: !GetAtt UnifiedOrdersTable.Arn

  # --- Car Orders Worker Lambda ---
  CarOrderWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CarOrderWorker
      Handler: index.handler
      Role: !GetAtt WorkerLambdaRole.Arn
      Runtime: python3.11
      Timeout: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref UnifiedOrdersTable
          ORDER_TYPE: "CAR"
      Code:
        ZipFile: |
          import json, os, boto3
          dynamodb = boto3.resource('dynamodb')
          def handler(event, context):
              table = dynamodb.Table(os.environ['TABLE_NAME'])
              for record in event['Records']:
                  payload = json.loads(record['body'])
                  message = json.loads(payload['Message'])
                  # Enriching item with explicit type metadata for single-table tracking
                  table.put_item(Item={
                      'OrderId': message.get('order_id', 'unknown'),
                      'OrderType': os.environ['ORDER_TYPE'],
                      'Details': message
                  })

  CarOrderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CarOrdersQueue.Arn
      FunctionName: !Ref CarOrderWorkerLambda
      BatchSize: 10

  # --- Bike Orders Worker Lambda ---
  BikeOrderWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: BikeOrderWorker
      Handler: index.handler
      Role: !GetAtt WorkerLambdaRole.Arn
      Runtime: python3.11
      Timeout: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref UnifiedOrdersTable
          ORDER_TYPE: "BIKE"
      Code:
        ZipFile: |
          import json, os, boto3
          dynamodb = boto3.resource('dynamodb')
          def handler(event, context):
              table = dynamodb.Table(os.environ['TABLE_NAME'])
              for record in event['Records']:
                  payload = json.loads(record['body'])
                  message = json.loads(payload['Message'])
                  table.put_item(Item={
                      'OrderId': message.get('order_id', 'unknown'),
                      'OrderType': os.environ['ORDER_TYPE'],
                      'Details': message
                  })

  BikeOrderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BikeOrdersQueue.Arn
      FunctionName: !Ref BikeOrderWorkerLambda
      BatchSize: 10