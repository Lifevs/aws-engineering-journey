AWSTemplateFormatVersion: '2010-09-09'
Description: 'Child Stack 3: EC2 Instance Provisioning'

Parameters:
  EnvType:
    Type: String
    Default: dev
  InstanceProfileArn:
    Type: String
  SecurityGroupId:
    Type: String

Mappings:
  # Standard Amazon Linux 2023 AMIs (Region-specific examples)
  RegionMap:
    us-east-1:
      AMI: ami-05b10e08d247fb927
    us-west-2:
      AMI: ami-03f38e546e3dc59e1
    eu-west-1:
      AMI: ami-0c660c18d6a8f1013

Resources:
  AppInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t3.micro
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      IamInstanceProfile: !Ref InstanceProfileArn
      SecurityGroupIds:
        - !Ref SecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${EnvType}-app-server'
        - Key: Environment
          Value: !Ref EnvType