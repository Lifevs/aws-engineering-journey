AWSTemplateFormatVersion: '2010-09-09'
Description: 'Child Stack 2: Security Groups for the 3-Tier Boundary'

Parameters:
  EnvType:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  InstanceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: !Sub 'Security Group for ${EnvType} App Tier'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Environment
          Value: !Ref EnvType

Outputs:
  SecurityGroupId:
    Description: 'Security Group ID for the Instance'
    Value: !Ref InstanceSecurityGroup