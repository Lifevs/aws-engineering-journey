AWSTemplateFormatVersion: '2010-09-09'
Description: 'Parent Root Stack orchestrating the 3-Tier Nested Architecture'

Parameters:
  EnvType:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: 'Specify the environment profile'

  S3TemplateBucket:
    Type: String
    Description: 'Name of the S3 bucket where child templates are stored (e.g., my-bucket-name)'

Resources:
  # 1. Deploy IAM Nested Stack
  IAMStack:
    Type: 'AWS::CloudFormation::Stack'
    Properties:
      TemplateURL: !Sub 'https://${S3TemplateBucket}.s3.amazonaws.com/iam-stack.yaml'
      Parameters:
        EnvType: !Ref EnvType

  # 2. Deploy Security Group Nested Stack
  SecurityGroupStack:
    Type: 'AWS::CloudFormation::Stack'
    Properties:
      TemplateURL: !Sub 'https://${S3TemplateBucket}.s3.amazonaws.com/security-group-stack.yaml'
      Parameters:
        EnvType: !Ref EnvType

  # 3. Deploy Compute Nested Stack (Depends on outputs from 1 and 2)
  ComputeStack:
    Type: 'AWS::CloudFormation::Stack'
    Properties:
      TemplateURL: !Sub 'https://${S3TemplateBucket}.s3.amazonaws.com/compute-stack.yaml'
      Parameters:
        EnvType: !Ref EnvType
        InstanceProfileArn: !GetAtt IAMStack.Outputs.InstanceProfileArn
        SecurityGroupId: !GetAtt SecurityGroupStack.Outputs.SecurityGroupId