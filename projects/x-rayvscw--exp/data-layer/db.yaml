AWSTemplateFormatVersion: '2010-09-09'
Description: 'Layer 1: DynamoDB Single-Table for School Observability Project'

Resources:
  SchoolDataTable:
    Type: AWS::DynamoDB::Table
    Properties: 
      TableName: SchoolPortalData
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: 
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: EntityType
          AttributeType: S
        - AttributeName: CreatedAt
          AttributeType: S
      KeySchema: 
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EntityTypeIndex
          KeySchema:
            - AttributeName: EntityType
              KeyType: HASH
            - AttributeName: CreatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: dev
        - Key: Project
          Value: XRay-Observability

Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref SchoolDataTable
    Export:
      Name: !Sub "${AWS::StackName}-SchoolTableName"
  TableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt SchoolDataTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SchoolTableArn"